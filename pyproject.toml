[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butian-plan"
version = "0.1.8"
description = "Platform-independent AI team orchestration and memory runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
butian = "butian.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
"butian.assets" = ["*.json", "*.sqlite3", "tools/*.py"]
"butian.web" = ["*.html", "*.js", "*.css"]

[tool.setuptools.packages.find]
include = ["butian*"]
